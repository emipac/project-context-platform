services:
  lightrag:
    build:
      context: ./services/lightrag
    ports:
      - "127.0.0.1:9621:9621"
    environment:
      LIGHTRAG_DATA_DIR: /data
      LIGHTRAG_BACKEND: ${LIGHTRAG_BACKEND:-contract}
      LIGHTRAG_LLM_PROVIDER: ${LIGHTRAG_LLM_PROVIDER:-openai}
      LIGHTRAG_LLM_MODEL: ${LIGHTRAG_LLM_MODEL:-gpt-4o-mini}
      LIGHTRAG_EMBEDDING_MODEL: ${LIGHTRAG_EMBEDDING_MODEL:-text-embedding-3-small}
      LIGHTRAG_EMBEDDING_DIM: ${LIGHTRAG_EMBEDDING_DIM:-1536}
      LIGHTRAG_QUERY_MODE: ${LIGHTRAG_QUERY_MODE:-hybrid}
      LIGHTRAG_MAX_ASYNC: ${LIGHTRAG_MAX_ASYNC:-4}
      LIGHTRAG_MAX_PARALLEL_INSERT: ${LIGHTRAG_MAX_PARALLEL_INSERT:-2}
      LIGHTRAG_TOP_K: ${LIGHTRAG_TOP_K:-40}
      LIGHTRAG_CHUNK_TOP_K: ${LIGHTRAG_CHUNK_TOP_K:-16}
      LIGHTRAG_MAX_TOTAL_TOKENS: ${LIGHTRAG_MAX_TOTAL_TOKENS:-20000}
      LIGHTRAG_OPENAI_BASE_URL: ${LIGHTRAG_OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - lightrag-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  graphiti:
    build:
      context: ./services/graphiti
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      GRAPHITI_DATA_DIR: /data
      GRAPHITI_BACKEND: ${GRAPHITI_BACKEND:-contract}
      GRAPHITI_TELEMETRY_ENABLED: "false"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: project-context
      GRAPHITI_LLM_PROVIDER: ${GRAPHITI_LLM_PROVIDER:-openai}
      GRAPHITI_LLM_MODEL: ${GRAPHITI_LLM_MODEL:-gpt-4o-mini}
      GRAPHITI_SMALL_LLM_MODEL: ${GRAPHITI_SMALL_LLM_MODEL:-gpt-4o-mini}
      GRAPHITI_EMBEDDING_MODEL: ${GRAPHITI_EMBEDDING_MODEL:-text-embedding-3-small}
      GRAPHITI_CONCURRENCY_LIMIT: ${GRAPHITI_CONCURRENCY_LIMIT:-2}
      GRAPHITI_OPENAI_BASE_URL: ${GRAPHITI_OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - graphiti-data:/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/project-context
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  lightrag-data:
  graphiti-data:
  neo4j-data:
