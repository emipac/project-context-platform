services:
  lightrag:
    build:
      context: ./services/lightrag
    ports:
      - "127.0.0.1:9621:9621"
    environment:
      LIGHTRAG_DATA_DIR: /data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - lightrag-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  graphiti:
    build:
      context: ./services/graphiti
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      GRAPHITI_DATA_DIR: /data
      GRAPHITI_ENABLE_CORE: ${GRAPHITI_ENABLE_CORE:-false}
      GRAPHITI_TELEMETRY_ENABLED: "false"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: project-context
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - graphiti-data:/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/project-context
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  lightrag-data:
  graphiti-data:
  neo4j-data:
